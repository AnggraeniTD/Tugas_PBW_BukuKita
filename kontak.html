<body>

    <h1>Kontak BukuKita</h1>

    <h2>Hubungi Kami</h2>

    <form>

        <label>Nama Lengkap:</label><br>
        <input type="text" name="nama"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email"><br><br>

        <label>Nomor Telepon:</label><br>
        <input type="text" name="telepon"><br><br>

        <label>Topik Pesan:</label><br>
        <select name="topik">
            <option>Pertanyaan Umum</option>
            <option>Pemesanan Buku</option>
            <option>Promo</option>
            <option>Keluhan</option>
        </select><br><br>

        <label>Pesan Anda:</label><br>
        <textarea name="pesan" rows="5" cols="40"></textarea><br><br>

        Bagaimana Anda Mengetahui Kami?<br>

        <input type="radio" name="sumber" value="media sosial">
        Media Sosial<br>

        <input type="radio" name="sumber" value="mesin pencari">
        Mesin Pencari<br>

        <input type="radio" name="sumber" value="teman">
        Rekomendasi Teman<br><br>

        <input type="checkbox" name="setuju">
        Saya menyetujui syarat dan ketentuan<br><br>

        <input type="submit" value="Kirim Pesan">

    </form>

</body>
